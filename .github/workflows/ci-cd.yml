name: 3-Stage CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: Build & Test
  # ==========================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test || echo "No tests to run or tests failed. Adjust this as needed."

      - name: Build Web Application
        run: flutter build web

      - name: Test Docker Build
        run: docker build -t reflecta-app:test .

  # ==========================================
  # STAGE 2: Deploy to Staging
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-test
    runs-on: self-hosted
    # Define o ambiente como 'staging'. Opcionalmente, configure no GitHub.
    environment: staging
    
    # Apenas executa no merge/push para a master (evita rodar em pull requests não aprovados)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment (On-Premise)
        run: |
          echo "🚀 Deploying Staging on self-hosted runner..."
          docker build -t reflecta-app:staging .
          docker stop reflecta-staging || true
          docker rm reflecta-staging || true
          docker run -d -p 8080:80 --name reflecta-staging reflecta-app:staging
          echo "✅ Staging is running on port 8080!"

  # ==========================================
  # STAGE 3: Deploy to Production
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: self-hosted
    # Define o ambiente como 'production'. No GitHub, você pode ativar a exigência
    # de "Aprovação Manual" (Manual Approval) nas configurações deste ambiente.
    environment: production
    
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Production Environment (On-Premise)
        run: |
          echo "🌟 Deploying Production on self-hosted runner..."
          docker build -t reflecta-app:latest .
          docker stop reflecta-production || true
          docker rm reflecta-production || true
          docker run -d -p 80:80 --name reflecta-production reflecta-app:latest
          echo "✅ Production is running on port 80!"
